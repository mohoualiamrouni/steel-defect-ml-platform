name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the runner has no GPU, and the default Linux wheels pull
          # several GB of CUDA libraries.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q steeldefect_platform steeldefect_ssl steeldefect_active_learning \
            defect_clustering datamining flatness_clustering

      - name: Run test suites
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "2"
        run: pytest -q -rf
