name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q steeldefect_platform steeldefect_ssl steeldefect_active_learning \
            defect_clustering datamining

      - name: Run test suites
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
          OMP_NUM_THREADS: "2"
        run: pytest -q
