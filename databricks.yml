# =============================================================================
# Databricks Asset Bundle — SteelDefect platform
#
# Infrastructure-as-code for the OBT pipeline described in the report
# (chapter "Réalisation", appendix "Plateforme de données"). The bundle declares
# seven jobs whose task keys reuse the node names of
# steeldefect_platform/jobs.py::JOBS_DAG (plus seed_obt and register_versions).
# Only the daily OBT job (02:00) and the weekly AL job (Monday 03:00) are
# scheduled; the seed, registry demo, A/B decision, regroup and SSL jobs run on
# demand. Dependencies across jobs are therefore not enforced, and openset_score
# runs after embedding_refresh rather than after ingest.
#
# The tasks of the AL, A/B decision, regroup and SSL jobs invoke the uniform
# dispatcher steeldefect_platform/run_task.py, which calls the real job_*
# entrypoints. The seed, registry demo and daily OBT tasks (7 of 13) run
# simplified, self-contained stand-in notebooks (seed_notebook.py, nb_*.py)
# because, on the serverless workspace used, reading workspace .py files failed
# with 409 BlobCustomerSpecifiedEncryptionMismatch. For example, nb_severity.py
# fits least squares with a fixed band instead of XGBoost + CQR, nb_ingest.py
# appends a fixed synthetic batch instead of merging, and nb_ab.py only registers
# two model versions (no A/B test). The run_task.py tasks import the package from
# workspace .py files too, so they are exposed to the same error on that
# workspace.
#
# Deploy with:  databricks bundle deploy -t dev
#               databricks bundle run steeldefect_obt_daily -t dev
#
# Conceptual DAG nodes deliberately NOT scheduled here (honest scoping):
#   * segmenter_train  — the inspection CNN is trained outside this repository
#                        (no training code or GPU job here). That job must
#                        register the versions, write the evaluation slice
#                        (steeldefect.ab_eval_slices) and each version's training
#                        manifest, images and coils, the current champion's
#                        included (steeldefect.model_training_images), which the
#                        A/B decision job reads.
#   * online_regroup   — long-running Structured Streaming
#                        (defect_clustering/databricks/03_online_regroup.py); it
#                        would run as a continuous job and is not deployed.
# =============================================================================

bundle:
  name: steeldefect-platform

# Ship only the code the jobs need: skip notebooks (.ipynb), caches, local outputs
# and images, plus Documentation/ and tn-report/ if such local folders sit in the
# clone (both are git-ignored and not part of this repository).
sync:
  exclude:
    - "Documentation/"
    - "tn-report/"
    - "**/*.ipynb"
    - "**/__pycache__/"
    - "**/outputs/"
    - "**/.pytest_cache/"
    - "**/*.png"

variables:
  catalog:
    description: Unity Catalog holding steeldefect.obt_segmentations
    default: steeldefect
  spark_version:
    description: Databricks Runtime (LTS)
    default: 15.4.x-scala2.12
  node_type_id:
    description: Worker/driver VM type (Azure)
    default: Standard_DS3_v2
  max_workers:
    description: Maximum workers for cluster autoscaling
    default: 4
  alert_email:
    description: Address notified on job failure
    default: alerts@example.com
  service_principal:
    description: Service principal that prod jobs run as (set in prod target)
    default: ""
  cycle_start:
    description: AL cycle start date (weekly pool build)
    default: "2026-06-01"
  run_id:
    description: Re-grouping run identifier (per release)
    default: "regroup-2026-06"
  ref_campaign:
    description: Reference cohort for drift (MMD)
    default: "campaign-2026-Q1"
  cur_campaign:
    description: Current cohort for drift (MMD)
    default: "campaign-2026-Q2"
  segmenter_model:
    description: Unity Catalog name (catalog.schema.model) of the model the A/B decision promotes
    default: "main.steeldefect.steeldefect_segmenter"

resources:
  jobs:

    # --- One-off: seed the OBT with calibrated-synthetic data (for the demo) ---
    # Run once after deploy:  databricks bundle run steeldefect_seed -t dev
    steeldefect_seed:
      name: "[${bundle.target}] steeldefect-seed"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 7200
      max_concurrent_runs: 1
      environments:                          # serverless: deps installed per run
        - environment_key: steeldefect_env
          spec:
            client: "2"
            dependencies:
              - scikit-learn
              - scipy
              - xgboost
              - statsmodels
              - mlflow
      tasks:
        - task_key: seed_obt
          notebook_task:                     # serverless can't read .py via spark_python_task
            notebook_path: ./seed_notebook.py

    # --- One-off: register two model versions + champion/challenger aliases ----
    # A registry demo (stand-in notebook): it runs no A/B test and decides nothing, on a
    # model of its own (..._registry_demo), so that it never moves the real @champion.
    steeldefect_registry_demo:
      name: "[${bundle.target}] steeldefect-registry-demo"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 3600
      max_concurrent_runs: 1
      tasks:
        - task_key: register_versions
          notebook_task:
            notebook_path: ./nb_ab.py

    # --- On demand: the A/B promotion decision (the tested gate) ---------------
    # Decides on challenger model_b_version against champion model_a_version of
    # ${var.segmenter_model} on one frozen slice of steeldefect.ab_eval_slices, records
    # the decision in steeldefect.ab_decisions, and on promote_B moves @champion from A
    # to B only if it still points at A. One decision per challenger per slice (a run on
    # invalid input does not count; promote=false does). Each parameter is passed as
    # its own --param argument, never spliced into JSON. The dev and prod deployments
    # share the tables and the model: run the decision from one target only.
    #   databricks bundle run steeldefect_ab_decision -t dev --params \
    #     eval_dataset_id=2026-05-eval,model_a_version=6,model_b_version=7
    steeldefect_ab_decision:
      name: "[${bundle.target}] steeldefect-ab-decision"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 3600
      max_concurrent_runs: 1                 # MLflow has no atomic compare-and-set on aliases
      parameters:                            # empty defaults: the job stops on them first
        - name: eval_dataset_id
          default: ""
        - name: model_a_version
          default: ""
        - name: model_b_version
          default: ""
        - name: promote
          default: "true"
      environments:                          # serverless: deps installed per run
        - environment_key: steeldefect_env
          spec:
            client: "2"
            dependencies:
              - scipy
              - statsmodels
              - seaborn
              - pyyaml
              - mlflow
      tasks:
        - task_key: ab_decision
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters:
              - "ab_decision"
              - "--param"
              - "eval_dataset_id={{job.parameters.eval_dataset_id}}"
              - "--param"
              - "model_a_version={{job.parameters.model_a_version}}"
              - "--param"
              - "model_b_version={{job.parameters.model_b_version}}"
              - "--param"
              - "promote={{job.parameters.promote}}"
              - "--param"
              - "model_name=${var.segmenter_model}"
              - "--param"
              - "registry_uri=databricks-uc"

    # --- Daily OBT pipeline: ingest -> severity -> cutting, + maintenance -----
    steeldefect_obt_daily:
      name: "[${bundle.target}] steeldefect-obt-daily"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 14400
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"   # 02:00 every day
        timezone_id: Europe/Brussels
      tasks:                                 # serverless notebook tasks (self-contained)
        - task_key: ingest
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./nb_ingest.py
        - task_key: severity_score
          depends_on:
            - task_key: ingest
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ./nb_severity.py
        - task_key: cutting_plan
          depends_on:
            - task_key: severity_score
          notebook_task:
            notebook_path: ./nb_cutting.py
        - task_key: drift_monitor
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./nb_drift.py
        - task_key: optimize_obt          # periodic OPTIMIZE ... ZORDER BY
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ./nb_optimize.py

    # --- Weekly active-learning pool build ------------------------------------
    steeldefect_al_weekly:
      name: "[${bundle.target}] steeldefect-al-weekly"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 7200
      max_concurrent_runs: 1
      environments:                          # serverless: deps installed per run
        - environment_key: steeldefect_env
          spec:
            client: "2"
            dependencies:
              - scikit-learn
              - scipy
              - xgboost
              - statsmodels
              - mlflow
      schedule:
        quartz_cron_expression: "0 0 3 ? * MON"  # 03:00 every Monday
        timezone_id: Europe/Brussels
      tasks:
        - task_key: al_pool_build
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters:
              - "al_pool_build"
              - "--params"
              - '{"cycle_start": "${var.cycle_start}", "budget": 200}'

    # --- Release-triggered defect re-grouping (manual / API trigger) ----------
    steeldefect_regroup_release:
      name: "[${bundle.target}] steeldefect-regroup-release"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 10800
      max_concurrent_runs: 1
      environments:                          # serverless: deps installed per run
        - environment_key: steeldefect_env
          spec:
            client: "2"
            dependencies:
              - scikit-learn
              - scipy
              - xgboost
              - statsmodels
              - mlflow
      tasks:
        - task_key: defect_regroup_train
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters:
              - "defect_regroup_train"
              - "--params"
              - '{"run_id": "${var.run_id}", "target_k": 28}'

    # --- P4: self-supervised encoder (on demand, serverless CPU) --------------
    # ssl_pretrain trains the SSL encoder on the calibrated-synthetic unlabeled pool;
    # embedding_refresh re-embeds the labeled/eval pools and reports probe/clustering
    # uplift (it does not rewrite the OBT); openset_score scores the synthetic stream
    # for novelty -> steeldefect.novelty_candidates.
    steeldefect_ssl_release:
      name: "[${bundle.target}] steeldefect-ssl-release"
      email_notifications:
        on_failure: ["${var.alert_email}"]
      timeout_seconds: 21600
      max_concurrent_runs: 1
      environments:                          # serverless: deps installed per run
        - environment_key: steeldefect_env
          spec:
            client: "2"
            dependencies:
              - scikit-learn
              - scipy
              - xgboost
              - statsmodels
              - mlflow
      tasks:
        - task_key: ssl_pretrain
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters: ["ssl_pretrain", "--params", '{"run_id": "${var.run_id}", "epochs": 20}']
        - task_key: embedding_refresh
          depends_on:
            - task_key: ssl_pretrain
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters: ["embedding_refresh", "--params", '{"run_id": "${var.run_id}"}']
        - task_key: openset_score
          depends_on:
            - task_key: embedding_refresh
          environment_key: steeldefect_env
          spark_python_task:
            python_file: steeldefect_platform/run_task.py
            parameters: ["openset_score", "--params", '{"since": "2026-01-01", "run_id": "${var.run_id}"}']

targets:
  # No workspace host is pinned here: the Databricks CLI uses the workspace of the
  # authenticated profile (databricks auth login) or DATABRICKS_HOST.
  # Development: schedules auto-paused, runs/objects prefixed with your user —
  # safe to deploy into a free/trial workspace for the screenshots.
  dev:
    mode: development
    default: true

  # Production: schedules active, deployed under a service principal.
  prod:
    mode: production
    run_as:
      service_principal_name: ${var.service_principal}   # prod jobs run as an SP, not a user
    workspace:
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      max_workers: 6
